[General]
Name = ztOS Bluetooth Device

[Policy]
AutoEnable = true

# LE links: a 5 s supervision timeout, as Android uses (the kernel default is
# 420 ms). RM_2685, 9 Nov: while it worked on a command from iTi it missed
# connection events for about half a second, and the 420 ms link timed out
# (HCI reason 0x08); on a phone the link would have held. Units of 10 ms.
[LE]
ConnectionSupervisionTimeout = 500
# 30 ms exactly: the bottom of Android's default range (30-50 ms, Fluoride's
# BTM_BLE_CONN_INT_MIN/MAX_DEF 24/40). Given 30-50 ms the BCM4361 takes
# 48.75 ms, and moved about one packet per connection event to RM_2685 (iTi's
# update, 9 Nov: 16 writes/s); at 30 ms that is about 27/s. Units of 1.25 ms.
MinConnectionInterval = 24
MaxConnectionInterval = 24
