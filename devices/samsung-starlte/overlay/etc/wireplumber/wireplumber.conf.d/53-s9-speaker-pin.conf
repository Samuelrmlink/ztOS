# The speakers' ALSA sink sits behind the ztos-speaker chain (crossover,
# high-pass, limiter), whose volume is the one the volume panel shows. Its own
# volume is unseen, and WirePlumber starts a new route at 40 % (-24 dB): the
# hardware part of that is the amplifier's digital volume (Speaker Playback
# Volume, at its -16 dB floor), the rest is software. ztos-audiod holds a sink
# with this mark at 100 % (amplifier at 0 dB, Samsung's own setting) while a
# chain is in front of it, and at most 40 % if ever there is none (no limiter).
# See audio/README.md, "Speaker gain".
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-snd-zrn-abox.*" }
    ]
    actions = {
      update-props = {
        ztos.volume.pinned = true
      }
    }
  }
]
