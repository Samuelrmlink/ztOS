[General]
Name = ztOS Bluetooth Device

[Policy]
AutoEnable = true

# LE links: a 5 s supervision timeout, as Android uses (the kernel default is
# 420 ms). RM_2685, 9 Nov: while it worked on a command from iTi it missed
# connection events for about half a second, and the 420 ms link timed out
# (HCI reason 0x08); on a phone the link would have held. Units of 10 ms.
[LE]
ConnectionSupervisionTimeout = 500
