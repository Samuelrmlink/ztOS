# The sensor hub's AP_SLEEP pulse at each suspend, as Samsung's ssp_suspend,
# and the resume counter ztoscsf-sensord follows to send 0xd3 (round 2,
# 30 Oct 2026: 6 of 6 bench sleeps clean, GPS off and streaming). zrn-bbd
# pulses only while host_req is a wake IRQ. Remove this line to go back.
options zrn_bbd ap_sleep_pulse=1

# zrn-flash switches on the S2MPB02's LDO9, without which the hub stays silent
# after a power-off. The hub has to power up with that rail already there.
softdep zrn_bbd pre: zrn-flash
