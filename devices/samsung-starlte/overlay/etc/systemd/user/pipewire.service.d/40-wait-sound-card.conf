# The session starts before zrn-audio has loaded the sound driver. PipeWire opens
# the microphone once, at startup, so wait for the card, for up to 20 seconds.
# Starting without it (a phone with no driver) still gives whatever else works.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /proc/asound/ZrnAbox ] && [ $i -lt 40 ]; do sleep 0.5; i=$((i+1)); done; exit 0'
