# geoclue reads the S9's GNSS NMEA straight from zrn-gnss-nmea through ztos-gnss-gate, which powers GPS only while geoclue reads.
[network-nmea]
enable=true
nmea-socket=/run/ztos-gnss/nmea.sock

# Only the phone's own GNSS, through the gate, so that the location switch
# (ztos-location, the Location tile) turns off everything: no Wi-Fi or
# cell-tower lookups, which would also send nearby networks to a server,
# and no modem GPS (the modem's is not used by ztOS).
[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[static-source]
enable=false
