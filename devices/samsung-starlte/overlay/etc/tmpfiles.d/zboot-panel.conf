# The panel may only sleep (DCS sleep in) once its self mask is off, or it shows dark patches at the
# top and bottom afterwards: ztos-panel-selfmask.service does that and then sets this to Y.
w /sys/module/s9p_decon/parameters/panel_sleep - - - - N
# The always-on display on the panel (ROADMAP 8.45, power/aod/PANEL-AOD.md): the shell
# (group video) parks its frame with aod_keep and drives the panel's HLPM and clock
# through the kernel's fixed stock sequences (kernel/patch-decon-aod.py, patch-decon-lpm.py).
z /sys/module/s9p_decon/parameters/aod_keep 0664 root video - -
z /sys/devices/platform/soc@0/16030000.decon/aod_lpm 0664 root video - -
z /sys/devices/platform/soc@0/16030000.decon/aod_clock 0220 root video - -
z /sys/devices/platform/soc@0/16030000.decon/aod_sprite 0220 root video - -
