# The panel may only sleep (DCS sleep in) once its self mask is off, or it shows dark patches at the
# top and bottom afterwards: ztos-panel-selfmask.service does that and then sets this to Y.
w /sys/module/s9p_decon/parameters/panel_sleep - - - - N
# The always-on display parked on the panel (ROADMAP 8.16): the shell (group video) sets aod_keep
# for the one blank that leaves its frame lit, so the SoC may sleep under it (kernel/patch-decon-aod.py).
z /sys/module/s9p_decon/parameters/aod_keep 0664 root video - -
