# USB audio (snd-usb-audio, ROADMAP 8.62): USB-C headphones and dongles.
# udev loads it when a USB audio interface appears (modules.alias, from depmod
# over /lib/modules/$(uname -r)/extra), at boot too if one is plugged in.
#
# index=-2: any card but the first, which stays the speakers' (ZrnAbox), so
# the order of loading doesn't matter.
options snd-usb-audio index=-2
# Through ztos-usb-audio-load, which keeps ztoscirrusaudio's kind of mark: a
# load that stopped the kernel is not tried again until the mark is removed.
install snd-usb-audio /usr/local/sbin/ztos-usb-audio-load
