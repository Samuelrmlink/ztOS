# Alarms + Clock (ztclockd, a user service) holds zrn-sleepd off while an alarm
# rings: /run/zrn-sleepd/inhibit/timed-ztclock. The directory stays root's; the
# admin group (the phone's user) may add and remove its own files there.
d /run/zrn-sleepd 0755 root root -
d /run/zrn-sleepd/inhibit 0755 root root -
a+ /run/zrn-sleepd/inhibit - - - - g:wheel:rwx
